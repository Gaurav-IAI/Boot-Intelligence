services:
  postgres:
    image: postgres:17-alpine
    container_name: uk-election-poc-db
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: uk_election
    ports:
      # 5433 on the host to avoid clashing with an existing local PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d uk_election"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
